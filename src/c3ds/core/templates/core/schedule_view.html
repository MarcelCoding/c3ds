{% extends "core/base.html" %}
{% load ds_utils vite %}
{% block header_text %}{{ view.title }}{% endblock %}
{% block content %}
    <div class="schedule-container text-highlight">
        <div class="schedule-layout" data-schedule-url="{{ view.schedule.local_url }}" data-room-filter="{{ view.room_filter | default:'' }}" data-guid-filter="{{ view.guid_filter | default:'' }}" data-duration-limit="{{ view.duration_limit | default:'' }}"></div>
        <div class="legend-container"></div>
    </div>
    {% vite 'core/ts/schedule.ts' %}
{% endblock %}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "c3ds"
version = "0.1.0"
description = "Digital signage application for c3 events"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1.3",
    "channels>=4.2.0",
    "channels-redis>=4.2.1",
    "csscompressor>=0.9.5",
    "daphne>=4.1.2",
    "django-compressor>=4.5.1",
    "django-environ>=0.11.2",
    "django_libsass>=0.9",
    "django_vite_plugin>=3.0.4",
    "hiredis>=2.4.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2.0",
    "requests>=2.32.3",
    "social-auth-app-django>=5.4.2",
]

[project.optional-dependencies]
dev = [
    "black",
    "django-debug-toolbar",
    "django-extensions",
    "flake8",
    "isort",
    "pur",
    "pyproject-flake8",
]

[project.scripts]
c3ds = "c3ds.manage:main"

[tool.hatch.build.targets.wheel]
packages = ["c3ds"]

[tool.black]
line-length = 120
target-version = ['py312']
skip-string-normalization = true

[tool.flake8]
max-line-length = 120
exclude = ['migrations', 'static']

[tool.isort]
line_length = 120
profile = "black"
skip = ['migrations', 'static']
